name: Validate and publish website

on:
  push:
    branches: [main]
    paths:
      - '*.html'
      - email-submit.js
      - favicon.svg
      - apple-touch-icon.png
      - brand/**
      - scripts/deploy_website.py
      - infrastructure/aws/deploy-config.json
      - infrastructure/aws/website-files.txt
      - infrastructure/aws/github-publish-role.json
      - .github/workflows/deploy-website.yml
  pull_request:
    branches: [main]
    paths:
      - '*.html'
      - email-submit.js
      - favicon.svg
      - apple-touch-icon.png
      - brand/**
      - scripts/deploy_website.py
      - infrastructure/aws/deploy-config.json
      - infrastructure/aws/website-files.txt
      - infrastructure/aws/github-publish-role.json
      - .github/workflows/deploy-website.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: '739871967026'
  AWS_DEPLOY_ROLE_ARN: arn:aws:iam::739871967026:role/alphawalk-github-deploy

jobs:
  validate:
    name: Validate the static upload allowlist
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out this revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check JavaScript syntax
        run: node --check email-submit.js
      - name: Validate files, API URL, and deployment permissions
        run: python3 scripts/deploy_website.py validate

  deploy:
    name: Publish to the new AWS account
    needs: validate
    if: >-
      github.repository == 'Moss-libe/alphaclawr' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: alphawalk-production-static
      cancel-in-progress: false
    steps:
      - name: Check out the exact approved revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prevent a stale run from overwriting a newer main revision
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          current_main=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')
          if [ "$current_main" != "$GITHUB_SHA" ]; then
            echo "This run is no longer the current main revision. Publish the newer run instead."
            exit 1
          fi
      - name: Confirm runner tools and prepare the upload plan
        run: |
          python3 --version
          aws --version
          python3 scripts/deploy_website.py validate
      - name: Obtain temporary AWS credentials through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}
          role-session-name: alphawalk-${{ github.run_id }}-${{ github.run_attempt }}
          role-duration-seconds: 1800
          unset-current-credentials: true
          translate-env-variables: false
          action-timeout-s: 120
          retry-max-attempts: 3
      - name: Upload approved files, invalidate the CDN, and verify the live result
        run: python3 scripts/deploy_website.py deploy
